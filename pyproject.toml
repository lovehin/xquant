[project]
name = "xquant"
version = "0.1.0"
description = "中国 A 股股债性价比 / 格雷厄姆指数仪表盘"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.19",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=3.0",
    "numpy>=2.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["xquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
